[project]
name = "learn-pydantic"
version = "0.1.0"
description = "Learn Pydantic v2 by example - validators, nested models & serialization with 6 hands-on demos"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Sudhansu490", email = "sudhansu490@github.com" }]
keywords = ["pydantic", "pydantic-v2", "data-validation", "python", "serialization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic[email]>=2.0",
    "email-validator>=2.0",
    "typing_extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/Sudhansu490/learn-pydantic"
Repository = "https://github.com/Sudhansu490/learn-pydantic"
Issues = "https://github.com/Sudhansu490/learn-pydantic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
